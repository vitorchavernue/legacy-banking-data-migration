g><g id="Tile Rejected backlog"><rect x="1008.0" y="840.0" width="414.0" height="144.0" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/><rect x="1030.0" y="870.0" width="84" height="84" rx="20" fill="url(#activeChip)"/><g transform="translate(1051.0 891.0) scale(1.7500)" fill="none" stroke="#FFFFFF" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5 6 5h12l2.5 8.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M3.5 13.5H8l1.5 2.5h5l1.5-2.5h4.5"/></g><text x="1134.0" y="906.0" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#FFFFFF">Rejected backlog</text><text x="1134.0" y="940.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.66">Reasons and burn-down</text><path d="M1386.0 903.0 l9 9 -9 9" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
